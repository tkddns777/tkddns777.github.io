<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>의료 AI - 나의 브레인스토밍</title>
    <style>
        /* 메인 화면과 동일한 배경색과 기본 스타일 */
        body {
            margin: 0;
            overflow: hidden; /* 스크롤바 없애기 */
            background-color: #050510; /* 깊고 어두운 남색/밤하늘색 */
            color: white;
            font-family: '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: center;    /* 세로 중앙 정렬 */
            height: 100vh;          /* 전체 화면 높이 사용 */
        }

        /* 중앙 문구 스타일 */
        .content {
            text-align: center;
            opacity: 0; /* 처음엔 투명하게 시작 */
            animation: fadeIn 1.5s ease-in-out forwards; /* 1.5초 동안 서서히 나타남 */
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7); /* Cyan색 네온 효과 */
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 메인 화면으로 돌아가는 버튼 */
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 20px;
            background-color: transparent;
            border: 2px solid cyan;
            color: cyan;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: cyan;
            color: #050510;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* 서서히 나타나는 애니메이션 정의 */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>여기는 의료 AI 페이지입니다</h1>
        <p>인공지능을 활용한 의료 진단, 치료법 개발 등에 대한 멋진 아이디어들을 이곳에 채워보세요!</p>
        <a href="index.html" class="back-button">← 브레인스토밍 메인으로 돌아가기</a>
    </div>
</body>
</html>
