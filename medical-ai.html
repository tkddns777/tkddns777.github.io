<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의료 AI - 나의 브레인스토밍</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: white;
            font-family: '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .content {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .model-links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .model-link {
            display: inline-block;
            padding: 12px 28px;
            background-color: transparent;
            border: 2px solid rgba(180, 100, 255, 0.7);
            color: rgba(200, 160, 255, 1);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 280px;
            font-size: 1rem;
        }

        .model-link:hover {
            background-color: rgba(180, 100, 255, 0.8);
            color: #fff;
            box-shadow: 0 0 15px rgba(180, 100, 255, 0.5);
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 20px;
            background-color: transparent;
            border: 2px solid cyan;
            color: cyan;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: cyan;
            color: #050510;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Medical AI Platform</h1>
        <p>딥러닝 기반 의료 영상 진단 플랫폼.<br>
           Grad-CAM 설명 가능 AI와 Gemini LLM 분석을 결합하여<br>
           폐렴, 뇌종양 등의 진단을 보조합니다.</p>

        <div class="model-links">
            <a href="xray-ai.html" class="model-link">Chest X-ray Pneumonia Detection</a>
            <a href="lung-ai.html" class="model-link">Lung Auscultation Detection</a>
            <a href="brain-mri-ai.html" class="model-link">Brain MRI Tumor Detection</a>
        </div>

        <a href="index.html" class="back-button">&larr; 브레인스토밍 메인으로 돌아가기</a>
    </div>
</body>
</html>
