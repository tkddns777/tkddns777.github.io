<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>뇌 신경망 브레인스토밍</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510; /* 깊은 밤하늘/뇌 속 같은 아주 어두운 남색 */
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            pointer-events: none; /* 마우스 간섭 방지 */
        }
    </style>
</head>
<body>
    <div id="info">마우스를 뇌 신경망 위로 올려보세요!</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 화면 크기에 맞추기
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const dots = [];
        const mouse = { x: -1000, y: -1000 }; // 초기 마우스 위치 (화면 밖)

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        
        // 마우스가 화면 밖으로 나가면 신호 끄기
        window.addEventListener('mouseout', function() {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        class Dot {
            constructor(x, y) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                // 약간씩 살아 숨쉬는 듯한 움직임을 위한 변수
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.02 + 0.01;
                this.radius = Math.random() * 20 + 10; // 제자리에서 움직일 반경
                
                this.pulse = 0; // 전기 신호 강도 (0 ~ 1)
            }
            update() {
                // 제자리 주변을 둥둥 떠다니게 (숨쉬는 뇌 효과)
                this.angle += this.speed;
                this.x = this.baseX + Math.cos(this.angle) * this.radius;
                this.y = this.baseY + Math.sin(this.angle) * this.radius;

                // 신호 서서히 감소 (불이 꺼지는 효과)
                this.pulse *= 0.92; 
                
                // 마우스와 닿으면 강력한 전기 신호(1) 발생!
                const dxMouse = this.x - mouse.x;
                const dyMouse = this.y - mouse.y;
                if (Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse) < 60) {
                    this.pulse = 1;
                }
            }
            draw() {
                // 신호 강도에 따라 점이 밝아짐
                const brightness = Math.floor(this.pulse * 255);
                ctx.fillStyle = `rgb(${brightness}, ${100 + brightness}, 255)`;
                ctx.beginPath();
                // 맥박이 뛸 때 점 크기도 살짝 커짐
                ctx.arc(this.x, this.y, 1.5 + this.pulse * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 뇌 모양(좌뇌, 우뇌 타원형) 안쪽에만 점을 생성하는 함수
        function createBrainNetwork() {
            dots.length = 0; // 초기화
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const brainSize = Math.min(canvas.width, canvas.height) * 0.35; // 뇌 전체 크기

            // 500개의 점을 생성할 때까지 무한 반복 시도
            let attempts = 0;
            while(dots.length < 500 && attempts < 5000) {
                attempts++;
                const rx = Math.random() * canvas.width;
                const ry = Math.random() * canvas.height;
                
                // 좌뇌와 우뇌 중심점
                const dxLeft = rx - (centerX - brainSize * 0.4);
                const dyLeft = ry - centerY;
                const dxRight = rx - (centerX + brainSize * 0.4);
                const dyRight = ry - centerY;
                
                // 타원 방정식으로 뇌 영역 제한
                const a = brainSize * 0.55; // 가로 반지름
                const b = brainSize * 0.8;  // 세로 반지름
                
                const insideLeft = (dxLeft*dxLeft)/(a*a) + (dyLeft*dyLeft)/(b*b) <= 1;
                const insideRight = (dxRight*dxRight)/(a*a) + (dyRight*dyRight)/(b*b) <= 1;

                if (insideLeft || insideRight) {
                    dots.push(new Dot(rx, ry));
                }
            }
        }
        createBrainNetwork();

        // 연결선 그리기 및 전기 신호 전파
        function handleNetwork() {
            for (let i = 0; i < dots.length; i++) {
                dots[i].update();
                dots[i].draw();

                for (let j = i + 1; j < dots.length; j++) {
                    const dx = dots[i].x - dots[j].x;
                    const dy = dots[i].y - dots[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // 가까운 점들끼리만 연결 (시냅스)
                    if (distance < 50) {
                        // 전기 신호 전파! (한 쪽이 밝으면 다른 쪽으로 빛이 퍼짐)
                        if (dots[i].pulse > 0.1 && dots[j].pulse < dots[i].pulse) {
                            dots[j].pulse += (dots[i].pulse - dots[j].pulse) * 0.15;
                        } else if (dots[j].pulse > 0.1 && dots[i].pulse < dots[j].pulse) {
                            dots[i].pulse += (dots[j].pulse - dots[i].pulse) * 0.15;
                        }

                        // 두 점의 신호 강도 평균을 내서 선의 밝기와 굵기 결정
                        const avgPulse = (dots[i].pulse + dots[j].pulse) / 2;
                        
                        // 기본은 아주 희미한 선, 신호가 오면 밝은 시안색(Cyan)으로 빛남
                        const alpha = 0.05 + avgPulse * 0.8; 
                        ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                        ctx.lineWidth = 0.5 + avgPulse * 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(dots[i].x, dots[i].y);
                        ctx.lineTo(dots[j].x, dots[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            // 잔상 효과 (화면을 완전히 지우지 않고 반투명한 검은색을 덧칠함)
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            handleNetwork();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // 창 크기가 바뀌면 뇌 모양 다시 그리기
        window.addEventListener('resize', function() {
            createBrainNetwork();
        });
    </script>
</body>
</html>
