<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 목표 - 나의 브레인스토밍</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: white;
            font-family: '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .content {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }
        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 20px;
            background-color: transparent;
            border: 2px solid cyan;
            color: cyan;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: cyan;
            color: #050510;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="content">
        <h1>나의 목표</h1>
        <p>개발자로서의 비전과 목표를 이곳에 채워보세요!</p>
        <a href="index.html" class="back-button">&larr; 브레인스토밍 메인으로 돌아가기</a>
    </div>
</body>
</html>
